# ?????? MySQL 8.0?
# 本地固定 8080：前端 BASE_URL 指向 http://192.168.1.8:8080，端口变了前端就调不通
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/guiz?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=guiz
spring.datasource.password=123456
spring.sql.init.mode=never

# ??????? IDEA ????????????????
wx.appid=${WX_APPID:}
wx.secret=${WX_SECRET:}

toutiao.appid=${TT_APPID:}
toutiao.secret=${TT_SECRET:}

# JWT
jwt.secret=${JWT_SECRET:}

# session_key 落地加密专用密钥（必须配置，与 jwt.secret 配置方式一致：dev 走环境变量 SESSION_ENCRYPT_KEY）。
# prod 在 application-prod.properties 设 session.encrypt-key=<随机串>（如 `openssl rand -hex 32`）。
session.encrypt-key=${SESSION_ENCRYPT_KEY}

jwt.expire-days=7


# 天气卡（和风天气 Web API key，dev 留空即可；生产值只写在 application-prod.properties）
weather.cache-minutes=10
# ????????????????????? = geoapi + devapi ? 1 ??
weather.daily-quota=600

# ── 天气（和风天气）──────────────────────────────
# 留空也能正常启动，只是 /api/weather 会回 "天气服务未配置"。
# 配法任选其一（key 永远不要写死在这个文件里，它能进 Git）：
#   ① 系统 / IDEA 环境变量  WEATHER_API_KEY / WEATHER_API_HOST（推荐）
#   ② IDEA 运行配置 → Environment variables 里加这两项
#   ③ 部署时写进 gitignore 的 application-prod.properties
# api-host 在控制台「项目」页拿，形如 xxxxx.re.qweatherapi.com，不用写 https://
weather.key=${WEATHER_API_KEY:}
weather.api-host=${WEATHER_API_HOST:}
