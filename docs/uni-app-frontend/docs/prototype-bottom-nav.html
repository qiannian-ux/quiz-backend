<title>探我趣测 · 底部导航原型</title>
<style>
  :root {
    --pink: #ff9db4;
    --blue: #a8c8ff;
    --ink: #3a4150;
    --ink-soft: #7b8494;
    --ink-faint: #aab2bf;
    --card: rgba(255, 255, 255, 0.92);
    --card-soft: rgba(255, 255, 255, 0.66);
    --grad: linear-gradient(160deg, #ffe8f1 0%, #efe6ff 45%, #e3f2ff 100%);
    --btn: linear-gradient(135deg, #ff9db4 0%, #a8c8ff 100%);
    --radius: 28px;
    --shadow: 0 14rpx 36rpx rgba(160, 170, 210, 0.20);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: #e9ecf5;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
    color: var(--ink);
  }

  /* 手机外框 */
  .phone {
    width: 390px;
    height: 844px;
    background: #11131a;
    border-radius: 46px;
    padding: 12px;
    box-shadow: 0 40px 90px rgba(60, 70, 110, 0.35);
    position: relative;
  }
  .screen {
    width: 100%;
    height: 100%;
    background: var(--grad);
    border-radius: 36px;
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
  }

  /* 状态栏 */
  .statusbar {
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 26px;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
    flex: none;
  }
  .statusbar .icons { display: flex; gap: 6px; align-items: center; }
  .statusbar .icons span { font-size: 12px; }

  /* 内容滚动区 */
  .scroll {
    flex: 1;
    overflow-y: auto;
    padding: 8px 22px 20px;
    -webkit-overflow-scrolling: touch;
  }
  .scroll::-webkit-scrollbar { width: 0; }

  /* 顶部问候 */
  .greet { margin: 6px 2px 18px; }
  .greet h1 { font-size: 26px; font-weight: 800; letter-spacing: 0.5px; }
  .greet p { font-size: 14px; color: var(--ink-soft); margin-top: 6px; }

  /* 搜索条 */
  .search {
    background: var(--card);
    border-radius: 20px;
    padding: 14px 18px;
    display: flex; align-items: center; gap: 10px;
    color: var(--ink-faint); font-size: 14px;
    box-shadow: var(--shadow);
    margin-bottom: 22px;
  }

  /* 区块标题 */
  .sec-title {
    display: flex; align-items: baseline; justify-content: space-between;
    margin: 4px 4px 14px;
  }
  .sec-title h2 { font-size: 18px; font-weight: 800; }
  .sec-title .more { font-size: 12px; color: var(--ink-faint); }

  /* 测评卡片网格 */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .qcard {
    background: var(--card);
    border-radius: var(--radius);
    padding: 18px 16px 16px;
    box-shadow: var(--shadow);
    cursor: pointer;
    transition: transform 0.15s ease;
    position: relative;
    overflow: hidden;
  }
  .qcard:active { transform: scale(0.97); }
  .qcard .emoji {
    width: 52px; height: 52px; border-radius: 18px;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; margin-bottom: 14px;
    box-shadow: 0 8px 18px rgba(160,170,210,0.22);
  }
  .qcard h3 { font-size: 16px; font-weight: 800; }
  .qcard .tag {
    display: inline-block; margin-top: 8px;
    font-size: 11px; color: var(--ink-soft);
    background: rgba(168,200,255,0.18);
    padding: 3px 10px; border-radius: 10px;
  }
  .qcard .meta { font-size: 11px; color: var(--ink-faint); margin-top: 10px; }

  /* 继续上次卡 */
  .resume {
    background: linear-gradient(135deg, rgba(255,214,165,0.55), rgba(255,200,220,0.45));
    border: 1.5px solid rgba(255,157,180,0.4);
    border-radius: var(--radius);
    padding: 18px 20px; margin-bottom: 22px;
    display: flex; align-items: center; justify-content: space-between;
    cursor: pointer;
  }
  .resume .t1 { font-size: 14px; font-weight: 700; color: #b0617a; }
  .resume .t2 { font-size: 12px; color: #8b6a74; margin-top: 4px; }
  .resume .go {
    font-size: 13px; font-weight: 800; color: #fff;
    background: var(--btn); padding: 10px 18px; border-radius: 22px;
  }

  /* 历史列表 */
  .hist-item {
    background: var(--card);
    border-radius: 22px;
    padding: 16px 18px;
    display: flex; align-items: center; gap: 14px;
    box-shadow: var(--shadow);
    margin-bottom: 14px;
  }
  .hist-badge {
    width: 50px; height: 50px; border-radius: 16px; flex: none;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 800; font-size: 15px;
  }
  .hist-main { flex: 1; }
  .hist-main .h { font-size: 15px; font-weight: 800; }
  .hist-main .s { font-size: 12px; color: var(--ink-soft); margin-top: 4px; }
  .hist-again {
    font-size: 12px; font-weight: 700; color: var(--ink-soft);
    border: 1.5px solid rgba(160,170,200,0.3);
    padding: 8px 14px; border-radius: 18px;
  }
  .empty {
    text-align: center; color: var(--ink-faint); margin-top: 120px;
    font-size: 14px; line-height: 2;
  }
  .empty .big { font-size: 46px; display: block; margin-bottom: 12px; }

  /* 我的 */
  .profile {
    background: var(--card);
    border-radius: var(--radius);
    padding: 22px; text-align: center;
    box-shadow: var(--shadow); margin-bottom: 18px;
  }
  .avatar {
    width: 76px; height: 76px; border-radius: 50%; margin: 0 auto 12px;
    background: var(--btn); display: flex; align-items: center; justify-content: center;
    font-size: 34px; box-shadow: 0 10px 24px rgba(255,157,180,0.34);
  }
  .profile .name { font-size: 19px; font-weight: 800; }
  .profile .sub { font-size: 12px; color: var(--ink-soft); margin-top: 6px; }
  .stats {
    display: flex; justify-content: space-around; margin-top: 18px;
    padding-top: 16px; border-top: 1px solid rgba(160,170,200,0.16);
  }
  .stats .num { font-size: 20px; font-weight: 800; }
  .stats .lab { font-size: 11px; color: var(--ink-soft); margin-top: 2px; }
  .menu { background: var(--card); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
  .menu .row {
    display: flex; align-items: center; gap: 14px;
    padding: 16px 18px; font-size: 15px; font-weight: 600;
    border-bottom: 1px solid rgba(160,170,200,0.12);
    cursor: pointer;
  }
  .menu .row:last-child { border-bottom: none; }
  .menu .ic { font-size: 18px; width: 22px; text-align: center; }
  .menu .arrow { margin-left: auto; color: var(--ink-faint); font-size: 14px; }
  .menu .pill {
    margin-left: auto; font-size: 11px; font-weight: 700; color: #b0617a;
    background: rgba(255,200,220,0.5); padding: 3px 10px; border-radius: 12px;
  }

  /* 底部导航 */
  .tabbar {
    flex: none;
    height: 78px;
    background: rgba(255,255,255,0.96);
    backdrop-filter: blur(12px);
    border-top: 1px solid rgba(160,170,200,0.18);
    display: flex;
    padding-bottom: 14px;
    border-radius: 0 0 36px 36px;
  }
  .tab {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 4px;
    cursor: pointer; color: var(--ink-faint); font-size: 11px; font-weight: 600;
    transition: color 0.15s ease;
  }
  .tab svg { width: 26px; height: 26px; }
  .tab.active { color: var(--pink); }
  .tab.active svg { transform: translateY(-1px); }

  /* 子流程（答题 / 结果）覆盖层 */
  .flow {
    position: absolute; inset: 0;
    background: var(--grad);
    display: flex; flex-direction: column;
    z-index: 5;
    transform: translateX(100%);
    transition: transform 0.28s cubic-bezier(0.22,1,0.36,1);
  }
  .flow.show { transform: translateX(0); }
  .flow-top {
    height: 52px; flex: none; display: flex; align-items: center; gap: 12px;
    padding: 0 18px; font-size: 16px; font-weight: 800;
  }
  .flow-back {
    width: 34px; height: 34px; border-radius: 50%;
    background: var(--card); display: flex; align-items: center; justify-content: center;
    font-size: 18px; box-shadow: var(--shadow);
  }
  .flow-body { flex: 1; overflow-y: auto; padding: 10px 22px 30px; }

  /* 进度 */
  .progress-wrap { margin: 14px 4px 22px; }
  .progress-top { display: flex; justify-content: space-between; font-size: 13px; color: var(--ink-soft); margin-bottom: 10px; }
  .pbar { height: 10px; border-radius: 6px; background: rgba(160,170,200,0.2); overflow: hidden; }
  .pfill { height: 100%; background: var(--btn); border-radius: 6px; transition: width 0.3s ease; }

  /* 题卡 */
  .qcard-big {
    background: var(--card); border-radius: var(--radius);
    padding: 28px 24px; box-shadow: var(--shadow);
  }
  .qcard-big .qno { font-size: 13px; font-weight: 700; color: var(--pink); }
  .qcard-big .qtext { font-size: 20px; font-weight: 800; line-height: 1.6; margin: 14px 0 24px; }
  .opt {
    background: var(--card-soft); border: 2px solid transparent;
    border-radius: 20px; padding: 18px 20px; margin-bottom: 14px;
    font-size: 16px; font-weight: 600; cursor: pointer;
    transition: all 0.15s ease;
  }
  .opt:active { transform: scale(0.98); }
  .opt.sel { border-color: var(--pink); background: rgba(255,157,180,0.12); }
  .next-btn {
    margin-top: 10px; height: 56px; border-radius: 28px;
    background: var(--btn); color: #fff; font-size: 17px; font-weight: 800;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 12px 28px rgba(255,157,180,0.36);
    cursor: pointer;
  }
  .next-btn.off { opacity: 0.5; }

  /* 结果页 */
  .result-hero { text-align: center; padding: 24px 10px 10px; }
  .result-hero .glow {
    width: 120px; height: 120px; border-radius: 50%; margin: 0 auto 18px;
    display: flex; align-items: center; justify-content: center; font-size: 52px;
    box-shadow: 0 14px 34px rgba(160,170,210,0.3);
  }
  .result-hero .lab { font-size: 13px; color: var(--ink-soft); letter-spacing: 3px; }
  .result-hero .title { font-size: 34px; font-weight: 800; margin-top: 8px; }
  .result-hero .sub { font-size: 14px; color: var(--ink-soft); margin-top: 8px; }
  .rcard { background: var(--card); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); margin-top: 18px; }
  .rcard h4 { font-size: 15px; font-weight: 800; margin-bottom: 14px; }
  .rbar { margin-bottom: 14px; }
  .rbar .rl { display: flex; justify-content: space-between; font-size: 13px; color: var(--ink-soft); margin-bottom: 6px; }
  .rtrack { height: 12px; border-radius: 7px; background: rgba(160,170,200,0.18); overflow: hidden; }
  .rfill { height: 100%; border-radius: 7px; }
  .unlock {
    margin-top: 18px; background: var(--card); border-radius: var(--radius);
    padding: 20px; box-shadow: var(--shadow); text-align: center;
  }
  .unlock h4 { font-size: 16px; font-weight: 800; }
  .unlock p { font-size: 13px; color: var(--ink-soft); margin: 8px 0 16px; }
  .ubtns { display: flex; gap: 12px; }
  .ubtns .b { flex: 1; height: 50px; border-radius: 25px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; }
  .ubtns .ad { background: rgba(168,200,255,0.9); color: var(--ink); }
  .ubtns .pay { background: var(--btn); color: #fff; }
  .result-actions { display: flex; gap: 12px; margin-top: 18px; }
  .result-actions .b { flex: 1; height: 54px; border-radius: 27px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 800; }
  .result-actions .prim { background: var(--btn); color: #fff; box-shadow: 0 12px 28px rgba(255,157,180,0.34); }
  .result-actions .ghost { background: var(--card-soft); color: var(--ink-soft); }

  /* 提示气泡 */
  .hint {
    position: absolute; bottom: 96px; left: 50%; transform: translateX(-50%);
    background: rgba(58,65,80,0.92); color: #fff; font-size: 13px;
    padding: 10px 16px; border-radius: 16px; z-index: 20; opacity: 0;
    transition: opacity 0.25s ease; pointer-events: none; white-space: nowrap;
  }
  .hint.show { opacity: 1; }
</style>

<script>
  // ===== 数据 =====
  const quizzes = [
    { code:'mbti',   name:'MBTI 性格',   emoji:'🧠', color:'#ff9db4', tag:'性格', count:24, done:'12.8w' },
    { code:'enneag', name:'九型人格',     emoji:'🌟', color:'#a8c8ff', tag:'性格', count:36, done:'6.2w' },
    { code:'big5',   name:'大五人格',     emoji:'📊', color:'#ffd28a', tag:'性格', count:30, done:'4.1w' },
    { code:'holland',name:'霍兰德职业',   emoji:'🔧', color:'#9ad7c4', tag:'职业', count:28, done:'3.3w' },
    { code:'love',   name:'恋爱依恋',     emoji:'💞', color:'#ffb3c8', tag:'情感', count:20, done:'8.9w' },
    { code:'eq',     name:'情商 EQ',      emoji:'🌈', color:'#c4a8ff', tag:'能力', count:22, done:'5.0w' },
  ];
  const history = [
    { name:'MBTI 性格', type:'ESTJ', color:'#ff9db4', time:'2 天前' },
    { name:'恋爱依恋',   type:'安全型', color:'#ffb3c8', time:'上周' },
    { name:'九型人格',   type:'第四型', color:'#a8c8ff', time:'3 周前' },
  ];

  const $ = (id) => document.getElementById(id);
  function hint(msg){ const h=$('hint'); h.textContent=msg; h.classList.add('show'); setTimeout(()=>h.classList.remove('show'),1400); }

  // ===== 渲染：首页 =====
  function renderHome(){
    const cards = quizzes.map(q => `
      <div class="qcard" onclick="startQuiz('${q.code}')">
        <div class="emoji" style="background:${q.color}33">${q.emoji}</div>
        <h3>${q.name}</h3>
        <span class="tag">${q.tag} · ${q.count}题</span>
        <div class="meta">${q.done} 人测过</div>
      </div>`).join('');
    $('homeScreen').innerHTML = `
      <div class="greet">
        <h1>你好呀 👋</h1>
        <p>今天想多了解自己一点吗？</p>
      </div>
      <div class="search">🔍 搜一搜想测的测评</div>
      <div class="resume" onclick="startQuiz('mbti')">
        <div><div class="t1">继续上次的 MBTI</div><div class="t2">还差 8 题 · 进度 67%</div></div>
        <div class="go">继续</div>
      </div>
      <div class="sec-title"><h2>热门测评</h2><span class="more">查看全部 ›</span></div>
      <div class="grid">${cards}</div>
      <div style="height:10px"></div>`;
  }

  // ===== 渲染：历史 =====
  function renderHistory(){
    if(!history.length){
      $('historyScreen').innerHTML = `<div class="empty"><span class="big">📭</span>还没有测过哦<br>去首页挑一个试试吧</div>`; return;
    }
    const items = history.map(h => `
      <div class="hist-item">
        <div class="hist-badge" style="background:${h.color}">${h.type.slice(0,2)}</div>
        <div class="hist-main"><div class="h">${h.name} · ${h.type}</div><div class="s">${h.time}</div></div>
        <div class="hist-again" onclick="hint('查看「${h.name}」报告')">再看</div>
      </div>`).join('');
    $('historyScreen').innerHTML = `
      <div class="greet"><h1>我的记录</h1><p>每一次探索，都值得被记住</p></div>
      ${items}
      <div style="height:10px"></div>`;
  }

  // ===== 渲染：我的 =====
  function renderMine(){
    $('mineScreen').innerHTML = `
      <div class="greet"><h1>我的</h1></div>
      <div class="profile">
        <div class="avatar">🐱</div>
        <div class="name">探我小用户</div>
        <div class="sub">点击编辑个人资料</div>
        <div class="stats">
          <div><div class="num">12</div><div class="lab">测过</div></div>
          <div><div class="num">3</div><div class="lab">收藏</div></div>
          <div><div class="num">5</div><div class="lab">连续天数</div></div>
        </div>
      </div>
      <div class="menu">
        <div class="row"><span class="ic">📋</span>我的报告<span class="arrow">›</span></div>
        <div class="row"><span class="ic">✨</span>已解锁内容<span class="pill">会员</span></div>
        <div class="row"><span class="ic">🔔</span>消息通知<span class="arrow">›</span></div>
        <div class="row"><span class="ic">⚙️</span>设置<span class="arrow">›</span></div>
        <div class="row"><span class="ic">💬</span>关于探我趣测<span class="arrow">›</span></div>
      </div>
      <div style="height:10px"></div>`;
  }

  // ===== Tab 切换 =====
  const screens = { home:'homeScreen', history:'historyScreen', mine:'mineScreen' };
  document.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => {
      const tab = t.dataset.tab;
      document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
      t.classList.add('active');
      Object.values(screens).forEach(id => $(id).style.display = 'none');
      $(screens[tab]).style.display = 'block';
      $(screens[tab]).scrollTop = 0;
    });
  });

  // ===== 答题流程（原型）=====
  let curQuiz = null, qIdx = 0, qTotal = 5, answers = [];
  const demoQuestions = [
    '在聚会里，你通常？', '做决定时你更看重？', '面对计划外的事，你？',
    '你更被哪种描述吸引？', '一周结束你更想？'
  ];
  const demoOpts = [['和很多人交谈，能量满满','安静待着，慢慢充电'],['逻辑与事实','感受与和谐'],['顺其自然，随机应变','提前安排，心里有底'],['具体的当下','可能的未来'],['出门走走见朋友','宅家回血独处']];

  function startQuiz(code){
    curQuiz = quizzes.find(q => q.code === code);
    qIdx = 0; answers = []; qTotal = 5;
    $('quizTitle').textContent = curQuiz.name;
    openFlow('quizFlow');
    renderQuiz();
  }
  function renderQuiz(){
    const sel = answers[qIdx];
    const opts = demoOpts[qIdx].map((o,i)=>`
      <div class="opt ${sel===i?'sel':''}" onclick="pickOpt(${i})">${o}</div>`).join('');
    $('quizBody').innerHTML = `
      <div class="progress-wrap">
        <div class="progress-top"><span>第 ${qIdx+1} / ${qTotal} 题</span><span>${Math.round((qIdx)/qTotal*100)}%</span></div>
        <div class="pbar"><div class="pfill" style="width:${(qIdx)/qTotal*100}%"></div></div>
      </div>
      <div class="qcard-big">
        <div class="qno">${curQuiz.emoji} ${curQuiz.name}</div>
        <div class="qtext">${demoQuestions[qIdx]}</div>
        ${opts}
      </div>
      <div class="next-btn ${sel==null?'off':''}" onclick="nextQ()">${qIdx===qTotal-1?'查看结果':'下一题'}</div>`;
    $('quizBody').scrollTop = 0;
  }
  function pickOpt(i){ answers[qIdx] = i; renderQuiz(); }
  function nextQ(){
    if(answers[qIdx]==null){ hint('先选一个答案哦'); return; }
    if(qIdx < qTotal-1){ qIdx++; renderQuiz(); }
    else { showResult(); }
  }

  // ===== 结果（原型）=====
  function showResult(){
    const dims = [
      {l:'外向 E', r:'内向 I', p:62, c:'#ff9db4'},
      {l:'直觉 N', r:'实感 S', p:71, c:'#a8c8ff'},
      {l:'情感 F', r:'思考 T', p:58, c:'#ffd28a'},
      {l:'判断 J', r:'知觉 P', p:80, c:'#9ad7c4'},
    ];
    const bars = dims.map(d=>`
      <div class="rbar">
        <div class="rl"><span>${d.l}</span><span>${d.p}%</span></div>
        <div class="rtrack"><div class="rfill" style="width:${d.p}%;background:${d.c}"></div></div>
      </div>`).join('');
    $('resultBody').innerHTML = `
      <div class="result-hero">
        <div class="glow" style="background:${curQuiz.color}">${curQuiz.emoji}</div>
        <div class="lab">你的隐藏属性是</div>
        <div class="title" style="color:${curQuiz.color}">${curQuiz.name} · 探索者</div>
        <div class="sub">你热情、好奇，又很会照顾别人</div>
      </div>
      <div class="rcard"><h4>你的维度构成</h4>${bars}</div>
      <div class="unlock">
        <h4>想看更走心的「深度解读」？</h4>
        <p>职业建议 · 感情匹配 · 成长小贴士</p>
        <div class="ubtns">
          <div class="b ad" onclick="hint('看广告 · 免费解锁')">看广告解锁</div>
          <div class="b pay" onclick="hint('¥5.9 · 解锁全站测评')">¥5.9 解锁</div>
        </div>
      </div>
      <div class="result-actions">
        <div class="b prim" onclick="hint('再测一次')">再测一次</div>
        <div class="b ghost" onclick="closeFlow()">回到首页</div>
      </div>
      <div style="height:10px"></div>`;
    closeFlow('quizFlow');
    openFlow('resultFlow');
    $('resultBody').scrollTop = 0;
  }

  // ===== 覆盖层 =====
  function openFlow(id){ $(id).classList.add('show'); }
  function closeFlow(keep){ document.querySelectorAll('.flow').forEach(f=>f.classList.remove('show')); }

  // 初始化
  renderHome(); renderHistory(); renderMine();
</script>
</body>
</html>
